[package]
name = "pattern-runtime"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
# Expose test-only hooks on pattern_runtime's public surface so
# integration tests can deterministically drive paths that the
# production API deliberately hides (e.g. session poisoning). Never
# enable this for downstream consumers — the hooks are not part of the
# stable API contract.
test-hooks = []

[dependencies]
pattern-core = { path = "../pattern_core" }
tidepool-runtime = { workspace = true }
tidepool-codegen = { workspace = true }
tidepool-effect  = { workspace = true }
tidepool-bridge  = { workspace = true }
tidepool-bridge-derive = { workspace = true }
tidepool-repr    = { workspace = true }
tidepool-eval    = { workspace = true }
frunk            = { workspace = true }
which            = { workspace = true }
async-trait      = { workspace = true }
tokio            = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing          = { workspace = true }
thiserror        = { workspace = true }
miette           = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
jiff             = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["rt-multi-thread", "test-util", "macros"] }
tidepool-testing = { workspace = true }
tracing-test   = { workspace = true }
tracing-subscriber = { workspace = true }
# Self-reference enabling the `test-hooks` feature only for this
# crate's own integration tests. Cargo permits `dep:self` style
# reachability: the integration test binaries link against the library
# crate with the feature enabled, while downstream users of this crate
# see no feature turned on unless they opt in explicitly.
pattern-runtime = { path = ".", features = ["test-hooks"] }
