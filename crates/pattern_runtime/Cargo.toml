[package]
name = "pattern-runtime"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
default = ["subscription-oauth"]

# Expose test-only hooks on pattern_runtime's public surface so
# integration tests can deterministically drive paths that the
# production API deliberately hides (e.g. session poisoning). Never
# enable this for downstream consumers — the hooks are not part of the
# stable API contract.
test-hooks = []

# Forward pattern-provider's subscription-oauth feature. When enabled,
# the `pattern-test-cli` bin exposes the interactive PKCE flow and the
# session-pickup + OAuth tiers of the Anthropic credential chain.
subscription-oauth = ["pattern-provider/subscription-oauth"]

[dependencies]
pattern-core = { path = "../pattern_core" }
pattern-db   = { path = "../pattern_db" }
# pattern-provider: consumed by the `pattern-test-cli` bin for live-tier
# auth + completion verification (AC3.1, AC4.1, AC4.3, Task 20). Phase 5
# integrates it into the TidepoolRuntime proper; holding the dep here
# means the bin + the Phase 5 wiring share a single edge in the dep graph.
pattern-provider = { path = "../pattern_provider" }
tidepool-runtime = { workspace = true }
tidepool-codegen = { workspace = true }
tidepool-effect  = { workspace = true }
tidepool-bridge  = { workspace = true }
tidepool-bridge-derive = { workspace = true }
tidepool-repr    = { workspace = true }
tidepool-eval    = { workspace = true }
genai            = { workspace = true }
frunk            = { workspace = true }
which            = { workspace = true }
async-trait      = { workspace = true }
tokio            = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing          = { workspace = true }
thiserror        = { workspace = true }
miette           = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
toml             = { workspace = true }
jiff             = { workspace = true }
smol_str         = { workspace = true }
# Stable content hashing for snapshot delta detection.
blake3           = { workspace = true }
# Bin-only deps (pattern-test-cli)
clap             = { workspace = true }
futures          = { workspace = true }
secrecy          = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy          = { workspace = true }
# Phase 6 Task 1: spawn subcommand REPL input.
rustyline-async  = "0.4"

[dev-dependencies]
chrono         = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "test-util", "macros"] }
tidepool-testing = { workspace = true }
tracing-test   = { workspace = true }
tracing-subscriber = { workspace = true }
# Self-reference enabling the `test-hooks` feature only for this
# crate's own integration tests. Cargo permits `dep:self` style
# reachability: the integration test binaries link against the library
# crate with the feature enabled, while downstream users of this crate
# see no feature turned on unless they opt in explicitly.
pattern-runtime = { path = ".", features = ["test-hooks"] }
