[package]
name = "pattern-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite storage backend for Pattern"

[dependencies]
# Workspace crates
pattern-core = { path = "../pattern_core", features = ["sqlite"] }

# Async runtime
tokio = { workspace = true }

# Database - rusqlite with bundled SQLite for consistent builds
rusqlite = { version = "0.39", features = ["bundled-full", "load_extension", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.33"
rusqlite_migration = "2.5"

# Vector search extension - bundles C source, compiles via cc
sqlite-vec = "0.1.9"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
miette = { workspace = true }

# Logging
tracing = { workspace = true }

# Utilities
chrono = { workspace = true, features = ["serde"] }
jiff = { workspace = true }
uuid = { workspace = true }

# Loro for CRDT memory blocks
loro = "1.6"

# For efficient vector serialization (zero-copy f32 slices to bytes)
zerocopy = { version = "0.8", features = ["derive"] }


[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
# Re-specify for integration tests that need direct access.
rusqlite = { version = "0.39", features = ["bundled-full"] }
rusqlite_migration = "2.5"
loro = "1.6"
serde_json = { workspace = true }

[features]
default = ["vector-search"]
# Enable sqlite-vec for vector search
vector-search = []
