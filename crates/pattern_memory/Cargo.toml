[package]
name = "pattern-memory"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Memory subsystem implementation for Pattern (MemoryCache, StructuredDocument, SharedBlockManager)"

[dependencies]
pattern-core = { path = "../pattern_core" }
pattern-db = { path = "../pattern_db" }

# jj CLI adapter
which = { workspace = true }
semver = "1"

# Runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Data
loro = { version = "1.10", features = ["counter"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Serialization formats
kdl = "6"
blake3 = { workspace = true }

# Sync subscriber worker
crossbeam-channel = "0.5"
tokio-util = { version = "0.7", features = ["rt"] }
metrics = "0.24"

# File system watcher
notify = "8"
notify-debouncer-full = "0.5"

# Errors + logging
thiserror = { workspace = true }
miette = { workspace = true }
tracing = { workspace = true }

# Utilities inherited from the original pattern_core::memory surface
dashmap = { version = "6.1.0", features = ["serde"] }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }

# Config parsing + VCS detection
knus = "3.3"
gix-discover = { version = "0.49", features = ["sha1"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
proptest = "1"
insta = { version = "1", features = ["yaml"] }

[lints]
workspace = true
