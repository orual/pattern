[package]
name = "pattern-memory"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Memory subsystem implementation for Pattern (MemoryCache, StructuredDocument, SharedBlockManager)"

[features]
default = []
test-support = []
export = ["dep:cid", "dep:iroh-car", "dep:ipld-core", "dep:multihash", "dep:multihash-codetable", "dep:serde_ipld_dagcbor", "dep:serde_bytes", "dep:serde_cbor", "dep:zstd"]

[dependencies]
pattern-core = { path = "../pattern_core" }
pattern-db = { path = "../pattern_db" }

# jj CLI adapter
which = { workspace = true }
semver = "1"

# Runtime
tokio = { workspace = true }
async-trait = { workspace = true }

# Data
loro = { version = "1.10", features = ["counter"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Serialization formats
kdl = "6"
blake3 = { workspace = true }

# Sync subscriber worker
crossbeam-channel = "0.5"
tokio-util = { version = "0.7", features = ["rt"] }
jiff = { workspace = true }
rusqlite = { version = "0.39", features = ["bundled-full"] }
metrics = { workspace = true }

# File system watcher
notify = "8"
notify-debouncer-full = "0.5"

# Errors + logging
thiserror = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
tracing = { workspace = true }

# Utilities inherited from the original pattern_core::memory surface
dashmap = { version = "6.1.0", features = ["serde"] }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }

# Config parsing + VCS detection
knus = "3.3"
gix-discover = { version = "0.49", features = ["sha1"] }

# Atomic rename-into-place for snapshot writes (must be a regular dep,
# not dev-dep, because create_snapshot uses NamedTempFile in production code).
tempfile = { workspace = true }

# CAR archive export/import (gated behind `export` feature)
cid = { workspace = true, optional = true }
iroh-car = { version = "0.5", optional = true }
ipld-core = { workspace = true, optional = true }
multihash = { workspace = true, optional = true }
multihash-codetable = { workspace = true, optional = true }
serde_ipld_dagcbor = { workspace = true, optional = true }
serde_bytes = { version = "0.11", optional = true }
serde_cbor = { workspace = true, optional = true }
zstd = { version = "0.13", optional = true }

[[test]]
name = "scope_isolation"
required-features = ["test-support"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tempfile = { workspace = true }
proptest = "1"
insta = { version = "1", features = ["yaml"] }
futures = { workspace = true }

[lints]
workspace = true
