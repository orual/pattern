[package]
name = "pattern-core"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core agent framework and memory system for Pattern"

[dependencies]
tokio = { workspace = true }
globset = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
jiff = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
secrecy = { workspace = true }

# CRDT (feature-gated: `memory`)
loro = { version = "1.10", features = ["counter"] }

# AI/LLM (feature-gated: `provider`)
genai = { workspace = true, optional = true }

# Optional: SQLite type conversions (enabled by pattern-db)
rusqlite = { version = "0.39", features = ["bundled-full"], optional = true }

# Optional: MCP client (Model Context Protocol)
rmcp = { workspace = true, features = ["transport-child-process", "client", "transport-streamable-http-client-reqwest", "client-side-sse"], optional = true }

# Schema generation
schemars = { workspace = true }
compact_str = { version = "0.9.0", features = ["serde", "markup", "smallvec"] }
smol_str = { workspace = true }
smallvec = { version = "1.15.1", features = ["serde"] }
ferroid = { workspace = true }

# Plugin registry
rand = "0.9.2"
base64 = "0.22"
url = "2.5"
value-ext = "0.1.2"

jacquard.workspace = true

# Plugin transport (feature-gated: `plugin-transport`)
iroh = { workspace = true, optional = true }
irpc = { workspace = true, optional = true }
irpc-iroh = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
nix = { version = "0.29", features = ["signal", "process"], optional = true }

# Web tool dependencies
regex = "1.11.1"

# Local crates (to be added later)
# pattern-nd = { path = "../pattern-nd", optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
pretty_assertions = "1.4"
tempfile = "3.0"
serial_test = "3.1"
tracing-test = "0.2"
proc-macro2-diagnostics = "0.10"
miette = { workspace = true, features = ["fancy"] }
proptest = "1"

[features]
default = ["memory", "provider"]

# `memory` feature retained as a no-op alias for back-compat callers; loro is now
# always pulled in (orual: "fine eating the loro dep", 2026-05-13). Can drop later.
memory = []

# LLM provider integration (genai). Required by `pattern_core::types::{message,turn,snapshot,provider}`
# and one `error::CoreError` variant. Plugin authors usually want this off.
provider = ["dep:genai"]

# Enable rusqlite FromSql/ToSql impls for domain enums
sqlite = ["rusqlite"]
mcp-client = ["dep:rmcp"]       # MCP client for tool invocation

# Plugin transport (iroh + irpc protocol enums + ALPN consts + auth primitives).
# Required by pattern_runtime + pattern_server + pattern_plugin_sdk. Plain consumers
# (pattern_cli depending only on domain types) don't need this — it pulls in iroh + irpc.
plugin-transport = ["dep:iroh", "dep:irpc", "dep:irpc-iroh", "dep:postcard", "dep:keyring", "dep:nix", "dep:dashmap"]


[lints]
workspace = true
