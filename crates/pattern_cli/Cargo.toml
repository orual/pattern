[package]
name = "pattern-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "pattern"
path = "src/main.rs"

[features]
default = ["oauth"]
oauth = ["pattern-core/oauth"]

[dependencies]
# Workspace dependencies
pattern-core = { path = "../pattern_core", features = ["export"] }
pattern-db = { path = "../pattern_db"}
pattern-memory = { path = "../pattern_memory" }
tokio = { workspace = true }
miette = { workspace = true, features = ["fancy", "syntect-highlighter"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# CLI-specific dependencies
indicatif = "0.17"
comfy-table = "7.1"
owo-colors = "4.2"
termimad = "0.31"
dialoguer = "0.11"
dirs = { workspace = true }
dotenvy = { workspace = true }
rustyline-async = "0.4"
rpassword = "7.3"
ratatui = "0.30.0"
ratatui-textarea = "0.9.1"
ratatui-widgets = { version = "0.3.0" }
ratatui-crossterm = { version = "0.1.0" }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
