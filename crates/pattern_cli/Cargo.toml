[package]
name = "pattern-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "pattern"
path = "src/main.rs"

[features]
default = ["oauth"]
oauth = ["pattern-provider/subscription-oauth"]

[dependencies]
# Workspace dependencies
pattern-core = { path = "../pattern_core" }
pattern-db = { path = "../pattern_db"}
pattern-memory = { path = "../pattern_memory" }
pattern-runtime = { path = "../pattern_runtime" }
pattern-provider = { path = "../pattern_provider" }
pattern-server = { path = "../pattern_server" }
nix = { version = "0.29", features = ["signal", "process"] }
which = { workspace = true }
tokio = { workspace = true }
miette = { workspace = true, features = ["fancy", "syntect-highlighter"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
irpc = { workspace = true }
async-trait = { workspace = true }

jiff = { workspace = true }
secrecy = { workspace = true }

# CLI-specific dependencies
indicatif = "0.17"
comfy-table = "7.1"
owo-colors = "4.2"
dialoguer = "0.11"
dirs = { workspace = true }
dotenvy = { workspace = true }
rustyline-async = "0.4"
rpassword = "7.3"
ratatui = "0.30.0"
ratatui-textarea = "0.9.1"
ratatui-widgets = { version = "0.3.0", features = ["unstable-rendered-line-info"] }
ratatui-crossterm = { version = "0.1.0" }
crossterm = { version = "0.29", features = ["event-stream"] }
nucleo = { workspace = true }
tui-markdown = { workspace = true }
smol_str = { workspace = true }
serde_json = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
unicode-width = { workspace = true }
unicase = { workspace = true }
askama = { workspace = true }
# Used by `pattern auth login openai` for the OAuth refresh HTTP client
# and to open the user's browser to the authorize URL.
reqwest = { workspace = true }
open = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
kdl = { workspace = true }
