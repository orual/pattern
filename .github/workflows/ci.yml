on:
  # Run only when pushing to main branch, and making PRs
  push:
    branches:
      - main
      - rewrite
  pull_request:
name: CI

jobs:
  check:
    name: Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install latest nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Install cargo nextest
        uses: taiki-e/install-action@nextest
      - name: Run cargo check
        uses: actions-rs/cargo@v1
        with:
          command: check
      - name: Test with latest nextest release
        uses: actions-rs/cargo@v1
        env:
          CARGO_TERM_COLOR: always
        with:
          command: nextest
          args: run --all-features --profile ci
      - name: Install jj for adapter canary
        run: |
          JJ_VERSION="0.40.0"
          curl -L \
            "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin jj
          jj --version
      - name: jj adapter canary
        env:
          CARGO_TERM_COLOR: always
        run: |
          cargo nextest run -p pattern-memory --test 'jj_adapter_*' --nocapture
